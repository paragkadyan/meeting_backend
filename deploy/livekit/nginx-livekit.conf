# nginx site for wss://livekit.heyllow.com -> LiveKit on 127.0.0.1:7880.
# Put in /etc/nginx/sites-available/livekit and link it into sites-enabled,
# then run certbot (see README.md) to add HTTPS.
server {
    listen 80;
    server_name livekit.heyllow.com;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # WebSocket upgrade: LiveKit's signalling runs over a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Calls stay connected for a long time; don't cut idle WebSockets.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
