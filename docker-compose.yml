services:
  postgres:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: chat_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  cassandra:
    image: cassandra:5
    container_name: cassandra_db
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "ChatCluster"
      CASSANDRA_NUM_TOKENS: 32
    volumes:
      - cassandra_data:/var/lib/cassandra

  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: livekit_server
    command: --bind 0.0.0.0
    # Keys and webhook settings come from this folder's .env, so LiveKit and the
    # backend always share the same LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
    # node_ip is the address browsers send audio/video to (Docker's internal IP
    # is unreachable from the host). For phones on your Wi-Fi, set
    # LIVEKIT_NODE_IP to the PC's LAN IP and drop the 127.0.0.1 port bindings.
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:3000/api/calls/livekit/webhook}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  redis-gui:
    image: rediscommander/redis-commander:latest
    container_name: redis_gui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  minio:
    image: quay.io/minio/minio
    container_name: minio_server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  cassandra_data:
  redis_data:
  pgadmin_data:
  minio_data:
